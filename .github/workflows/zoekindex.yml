# Zoekindex van het Arsenaal (Pagefind) en de bestandenlijst van de app bijwerken bij elke wijziging op main.
# Bouwt de map pagefind/ met hulpmiddelen/zoekindex.mjs (alleen terug als de doorzoekbare inhoud echt veranderd is)
# en daarna app-bestanden.json met hulpmiddelen/appbestanden.mjs (wat de app offline op het toestel zet).
name: Zoekindex

on:
  push:
    branches: [main]
    paths-ignore:
      - 'pagefind/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zoekindex
  cancel-in-progress: true

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gereedschap installeren
        run: |
          npm install --no-save --no-package-lock pagefind@1.5.2 playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Zoekindex bouwen
        run: node hulpmiddelen/zoekindex.mjs

      - name: Ongewijzigde index terugdraaien
        run: |
          # Alleen de inhoud (fragment/ en index/) telt; filter- en metabestanden krijgen bij elke bouw
          # een andere naam, ook als er niets veranderd is. Is de inhoud gelijk, dan blijft de oude index staan.
          git add -A pagefind
          if git diff --cached --quiet -- pagefind/fragment pagefind/index pagefind/pagefind.js; then
            echo "Doorzoekbare inhoud ongewijzigd."
            git reset -q -- pagefind
            git checkout -- pagefind
            git clean -fdq pagefind
          fi

      - name: Bestandenlijst voor de app bijwerken
        run: node hulpmiddelen/appbestanden.mjs

      - name: Terugzetten als er iets veranderd is
        run: |
          git add -A pagefind app-bestanden.json
          if git diff --cached --quiet; then
            echo "Niets te doen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Zoekindex en app-bestanden bijgewerkt"
          git pull --rebase origin main
          git push
